name: Build minutes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tool/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tool/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: tool

      - name: Build pages and folder indexes
        run: pnpm build
        working-directory: tool

      - name: Collect site
        run: |
          mkdir _site
          rsync -a --prune-empty-dirs \
            --exclude '.*' --exclude tool --exclude _site \
            --include '*/' --include '*.html' --include '*.css' --include '*.js' \
            --include '*.png' --include '*.jpg' --include '*.jpeg' --include '*.gif' --include '*.svg' --include '*.webp' \
            --exclude '*' \
            ./ _site/
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
